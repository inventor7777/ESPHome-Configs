# Include with vars: {uart_id: your_existing_uart_id}.
# Send complete frames; this action does not add a protocol header or checksum.
button:
  - platform: template
    id: ${uart_id}_reset
    name: Reset UART
    icon: mdi:restart
    entity_category: config
    on_press:
      - lambda: |-
          auto *bus = id(${uart_id});
          #if defined(USE_LIBRETINY)
          auto *serial = bus->get_hw_serial();
          if (serial == nullptr) {
            ESP_LOGW("uart_reset", "UART is not initialized");
            return;
          }
          serial->end();
          serial->begin(bus->get_baud_rate(), bus->get_config());
          #elif defined(USE_ESP32) || defined(USE_ESP8266)
          bus->load_settings(false);
          #else
          ESP_LOGW("uart_reset", "UART reset is unsupported on this platform");
          return;
          #endif
          ESP_LOGI("uart_reset", "UART reinitialized");

api:
  actions:
    - action: uart_write
      description: Send raw bytes through the configured UART bus.
      variables:
        frame_bytes: int[]
      then:
        - uart.write:
            id: ${uart_id}
            data: !lambda |-
              std::vector<uint8_t> bytes;
              bytes.reserve(frame_bytes.size());
              for (int value : frame_bytes) {
                if (value < 0 || value > 255) {
                  ESP_LOGW("uart_debug", "No bytes sent: values must be 0..255");
                  return std::vector<uint8_t>{};
                }
                bytes.push_back(static_cast<uint8_t>(value));
              }
              ESP_LOGD("uart_debug", "TX %s", format_hex_pretty(bytes.data(), bytes.size()).c_str());
              return bytes;
