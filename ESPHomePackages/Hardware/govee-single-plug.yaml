# Shared single-outlet behavior for Govee H5080/H5083, RTL8720CF.
# Include the model-specific govee-h5080.yaml or govee-h5083.yaml.
packages:
  - !include
    file: ../relay.yaml
    vars:
      relay_pin: ${govee_plug_relay_pin}
      relay_button_pin: ${govee_plug_button_pin}
      relay_id: outlet
      relay_name: Outlet
      relay_name_prefix: ''
      relay_ready_id: statistics_ready
esphome:
  project:
    name: Govee.${govee_plug_model}
    version: ''
  # Work around the MCP macOS builder's PCH path quoting failure.
  environment_variables:
    ESPHOME_PCH_ENABLE: '0'
  platformio_options:
    board_flash.ota1: 0x00C000+0xE0000
    board_flash.ota2: 0x0EC000+0xE0000
  on_boot:
    - priority: -101
      then:
        - script.execute: outlet_update_led
rtl87xx:
  board: generic-rtl8720cf-2mb-896k

switch:
  - id: !extend outlet
    on_turn_on:
      then:
        - if:
            condition:
              lambda: return id(statistics_ready);
            then:
              - script.execute: outlet_update_led
    on_turn_off:
      then:
        - if:
            condition:
              lambda: return id(statistics_ready);
            then:
              - script.execute: outlet_update_led
  - platform: template
    id: outlet_led_enabled
    name: LED Enabled
    entity_category: config
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    on_turn_on:
      then:
        - script.execute: outlet_update_led
    on_turn_off:
      then:
        - script.execute: outlet_update_led
  - platform: template
    id: outlet_standby_led
    name: Standby LED
    entity_category: config
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    on_turn_on:
      then:
        - script.execute: outlet_update_led
    on_turn_off:
      then:
        - script.execute: outlet_update_led
binary_sensor:
  - id: !extend outlet_button
    on_press:
      then:
        - if:
            condition:
              lambda: return id(outlet_button_lock).state;
            then:
              - script.execute: outlet_lock_feedback
output:
  # Active-low blue outlet indicator.
  - platform: gpio
    id: outlet_on_led
    pin:
      number: ${govee_plug_blue_pin}
      inverted: true
  # Red standby/feedback indicators use PWM; blue on indicators use GPIO.
  - platform: libretiny_pwm
    id: outlet_status_led
    frequency: 1kHz
    pin:
      number: ${govee_plug_red_pin}
      inverted: true

light:
  - platform: monochromatic
    id: outlet_red_led
    output: outlet_status_led
    internal: true
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF

number:
  - platform: template
    id: outlet_standby_brightness
    name: Standby LED Brightness
    entity_category: config
    unit_of_measurement: '%'
    min_value: 1
    max_value: 100
    step: 1
    initial_value: 30
    restore_value: true
    optimistic: true
    icon: mdi:led-off
    on_value:
      - then:
          - script.execute: outlet_update_led
script:
  - id: outlet_update_led
    mode: restart
    then:
      - lambda: |-
          const bool blue_on = id(outlet_led_enabled).state && id(outlet).state;
          if (blue_on) id(outlet_on_led).turn_on();
          else id(outlet_on_led).turn_off();
          const bool red_on = id(outlet_led_enabled).state && !id(outlet).state && id(outlet_standby_led).state;
          const float brightness = id(outlet_standby_brightness).state / 100.0f;
          auto &values = id(outlet_red_led).remote_values;
          if (values.is_on() != red_on || (red_on && fabsf(values.get_brightness() - brightness) > 0.005f)) {
            auto call = id(outlet_red_led).make_call();
            call.set_state(red_on);
            if (red_on) call.set_brightness(brightness);
            call.perform();
          }
  - id: outlet_lock_feedback
    mode: restart
    then:
      - lambda: id(outlet_red_led).turn_off().perform();
      - delay: 250ms
      - lambda: auto call = id(outlet_red_led).turn_on(); call.set_brightness(1.0f); call.perform();
      - delay: 250ms
      - lambda: id(outlet_red_led).turn_off().perform();
      - delay: 250ms
      - lambda: auto call = id(outlet_red_led).turn_on(); call.set_brightness(1.0f); call.perform();
      - delay: 250ms
      - script.execute: outlet_update_led
interval:
  - interval: 1s
    then:
      - if:
          condition:
            lambda: return !id(outlet_lock_feedback).is_running();
          then:
            - script.execute: outlet_update_led
