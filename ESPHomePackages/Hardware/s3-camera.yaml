esp32:
  variant: ESP32S3
  framework:
    type: esp-idf
  flash_size: 16MB
  cpu_frequency: 240MHZ
  
psram: # Configure PSRAM for camera use
  mode: octal
  speed: 80MHz

packages:
  status_led: !include
    file: ../status_led.yaml
    vars:
      status_led_gpio: GPIO2
  rgb_led: !include
    file: ../rgb_led.yaml
    vars:
      rgb_led_gpio: GPIO48
      rgb_led_chipset: ws2812
      rgb_led_rgb_order: GRB
      rgb_led_num_leds: "1"
      rgb_led_rmt_symbols: "48"

i2c:
  - id: camera_i2c
    sda: GPIO4
    scl: GPIO5

binary_sensor:
  - platform: gpio
    id: boot_button
    name: "Boot Button"
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
