esp32:
  variant: esp32p4
  engineering_sample: true
  flash_size: 32MB
  cpu_frequency: 360MHz
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true
    #sdkconfig_options:
      #CONFIG_IDF_EXPERIMENTAL_FEATURES: "y"
      #CONFIG_ESP_FORCE_400MHZ_ON_REV_LESS_V3: "y"
    
psram:
  mode: hex
  speed: 200MHz
    
logger:
  hardware_uart: UART0
  
ethernet:
  type: IP101
  mdc_pin: GPIO31
  mdio_pin: GPIO52
  power_pin: GPIO51
  clk: 
    mode: CLK_EXT_IN
    pin: GPIO50
  phy_addr: 1