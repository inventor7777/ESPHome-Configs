esp32:
  variant: ESP32C6
  framework:
    type: esp-idf

packages:
  status_led: !include
    file: ../status_led.yaml
    vars:
      status_led_gpio: GPIO15
      status_led_inverted: "false"
  rgb_led: !include
    file: ../rgb_led.yaml
    vars:
      rgb_led_gpio: GPIO8
      rgb_led_chipset: ws2812
      rgb_led_channel_colors: GRB
      rgb_led_num_leds: "1"
      rgb_led_rmt_symbols: "48"
    
binary_sensor:
  - platform: gpio
    name: "Boot Button"
    id: boot_button
    pin:
      number: GPIO9
      mode: INPUT_PULLUP
      inverted: true
