time:
  - id: !extend sntp_time
    on_time:
      - hours: 8
        minutes: 45
        seconds: 0
        days_of_week: SUN
        then:
        - light.turn_off: main_backlight
        - logger.log:
            level: INFO
            tag: user
            format: "Turning off backlight for Sunday morning"

      - hours: 12
        minutes: 15
        seconds: 0
        days_of_week: SUN
        then:
          - if:
              condition:
                binary_sensor.is_on: vacation_mode
              then:
                - logger.log:
                    level: INFO
                    tag: user
                    format: "Sunday afternoon: vacation mode is on; leaving backlight off"
              else:
                - light.turn_on: main_backlight
                - logger.log:
                    level: INFO
                    tag: user
                    format: "Sunday afternoon: vacation mode is off or unavailable; turning backlight on"
          
      - hours: 0
        minutes: 0
        seconds: 0
        then:
        - logger.log:
            level: INFO
            tag: user
            format: "Activating antiburn for 30 minutes"
        - lvgl.pause:
            show_snow: true

      - hours: 0
        minutes: 30
        seconds: 0
        then:
          - logger.log:
              level: INFO
              tag: user
              format: "Antiburn session complete, pausing LVGL"
          - lvgl.page.show: blank_page
          - lvgl.pause:
